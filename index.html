 {eyebrow:'Page one · Look up',title:'A tiny dot in a giant sky.',body:'Pine and Parker were the storytellers who loved big questions. Tonight, their friend Johnny was supposed to be brushing his teeth, but then he saw something glowing outside his window. Mars! It was small, red, and very far away. He pressed his nose to the glass and whispered, “I wonder what it feels like up there?”',hint:'Tap the twinkling star to make a wish.',art:()=>`<div class="scene stars"><div class="moon"></div><div class="tap-star interactive" id="star"></div><input class="wish-box" id="wish" maxlength="45" placeholder="Type your wish here"><div class="hill"></div><div class="face"></div><div class="tap-target interactive" id="telescope"></div></div>`},
 {eyebrow:'Page two · Gather',title:'A rocket needs good stuff.',body:'Johnny knew exactly what to do next. He found a box for the body, a colander for the window, and pillows for a very soft seat. He carried every bit to the garage while his dog followed, wondering if this was really a good idea.',hint:'Drag three supplies into Johnny’s basket.',art:()=>`<div class="scene garage"><div class="supply s1 interactive" draggable="true"></div><div class="supply s2 interactive" draggable="true"></div><div class="supply s3 interactive" draggable="true"></div><div class="supply s4 interactive" draggable="true"></div><div class="supply s5 interactive" draggable="true"></div><div class="basket interactive" id="basket"></div><div class="drag-note">DRAG TO THE BASKET · <span id="packed">0</span> / 3 PACKED</div></div>`},
 {eyebrow:'Page three · Build',title:'Draw your own rocket!',body:'Now it is your turn to be the designer. Give Johnny’s rocket a name and draw windows, flames, stripes, or anything you imagine. His dog is ready to judge your masterpiece.',hint:'Write a name and draw your rocket on the paper.',art:()=>`<div class="scene garage"><div class="roof"></div><input class="rocket-name" id="rocketName" maxlength="18" placeholder="Name your rocket" value="${rocketName}"><div class="blueprint"><canvas class="draw-canvas" id="draw"></canvas></div><div class="crayon interactive" id="crayon" aria-label="Crayon"></div><div id="rocket" style="display:none"></div></div>`},
 {eyebrow:'Page four · Blast off',title:'Five… four… three…',body:'Johnny climbed inside and pulled the biggest lever he could find. “Ready, Rocket?” he asked. The garage door flew open. Johnny held on tight. Dog held on tighter. “Two… one… WHOOSH!”',hint:'Tap your rocket to launch it into space.',art:()=>`<div class="scene stars"><div class="moon"></div><img class="launch-rocket interactive" id="launchRocket" src="${drawingData}" alt="Your rocket drawing"><div class="flames"></div><div class="hill"></div></div>`},
 {eyebrow:'Page five · Land',title:'Mars has excellent dust.',body:'Down they tumbled through the peachy sky and landed with a soft PLOP. Johnny bounced once. Dog bounced twice. Together they planted a flag beside the rocket you designed.',hint:'Tap your rocket to make it bounce on Mars.',art:()=>`<div class="scene mars"><div class="mars-orbit"></div><div class="made-again" id="madeAgain">${rocketName?'Welcome, '+rocketName+'!':'Your rocket'}${drawingData?`<img src="${drawingData}" alt="Your rocket design">`:''}</div><img class="landing-rocket interactive" id="lander" src="${drawingData}" alt="Your rocket landing on Mars"><div class="flag"></div><div class="crater"></div></div>`},
 {eyebrow:'Page six · Oops',title:'He forgot the snacks.',body:'Johnny looked in the empty basket. No sandwiches. No apples. Not even one tiny cookie. His dog looked at Johnny. Mars looked deliciously dusty. Johnny smiled anyway. “Next trip,” he said, “we pack snacks first.”',hint:'Tap the crumb to share a tiny snack.',art:()=>`<div class="scene snack"><div class="bubble">A space adventure is better with a friend.</div><div class="earth"></div><div class="empty"></div><div class="crumb interactive" id="crumb"></div></div>`}
];
let page=0;const $=id=>document.getElementById(id);function render(){let p=pages[page];$('eyebrow').textContent=p.eyebrow;$('title').textContent=p.title;$('body').textContent=p.body;$('hint').innerHTML='<b>✦</b>'+p.hint;$('art').innerHTML=p.art();$('count').textContent=`${page+1} / ${pages.length}`;$('bar').style.width=`${(page+1)/pages.length*100}%`;$('prev').disabled=page===0;$('next').textContent=page===pages.length-1?'↺ Read again':'Next page →';$('dots').innerHTML=pages.map((_,i)=>`<span class="${i===page?'on':''}"></span>`).join('');bind();}
function bind(){if(page===0){$('star').onclick=()=>{$('star').classList.toggle('popped');$('telescope').textContent='';}}if(page===1){let n=0;const basket=$('basket');document.querySelectorAll('.supply').forEach(x=>{x.ondragstart=e=>e.dataTransfer.setData('text/plain','supply');x.onclick=()=>{if(!x.classList.contains('placed')&&n<3){x.classList.add('placed');n++;$('packed').textContent=n;}};x.ondragend=()=>{};});basket.ondragover=e=>e.preventDefault();basket.ondrop=e=>{e.preventDefault();const x=[...document.querySelectorAll('.supply')].find(s=>!s.classList.contains('placed'));if(x&&n<3){x.classList.add('placed');n++;$('packed').textContent=n;}}}if(page===2){let down;const r=$('rocket');const c=$('draw'),ctx=c.getContext('2d');function size(){c.width=c.clientWidth*2;c.height=c.clientHeight*2;ctx.scale(2,2);ctx.lineWidth=7;ctx.lineCap='round';ctx.strokeStyle='#f06f5c'}setTimeout(size,0);let drawing=false;c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);$('crayon').classList.add('active')};c.onpointermove=e=>{if(drawing){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()}};c.onpointerup=()=>{drawing=false;$('crayon').classList.remove('active')};r.onpointerdown=()=>{down=setTimeout(()=>{r.classList.add('launch');document.querySelector('.scene').classList.add('launch')},450)};r.onpointerup=()=>clearTimeout(down);r.onpointerleave=()=>clearTimeout(down)}if(page===3)$('launchRocket').onclick=()=>{$('launchRocket').classList.add('launch');$('art').classList.add('shake')};if(page===4)$('lander').onclick=()=>{$('lander').classList.remove('bounce');void $('lander').offsetWidth;$('lander').classList.add('bounce')};if(page===5)$('crumb').onclick=()=>{$('crumb').classList.add('eaten');$('hint').innerHTML='<b>✦</b>Crunch! Friends make the best crew.'}}
$('next').onclick=()=>{page=(page+1)%pages.length;render()};$('prev').onclick=()=>{if(page>0){page--;render()}};render();
 $('start').onclick=()=>{$('welcome').classList.add('hide')};document.addEventListener('input',e=>{if(e.target.id==='rocketName')rocketName=e.target.value});document.addEventListener('pointerup',()=>{const c=$('draw');if(c&&page===2)drawingData=c.toDataURL('image/png')});document.addEventListener('click',e=>{if(e.target.id==='star'){$('star').classList.add('wished');$('wish').classList.add('show');$('wish').focus();$('telescope').style.display='none';if(!$('wishSubmit')){const b=document.createElement('button');b.id='wishSubmit';b.textContent='Submit wish';b.style.cssText='display:block;margin:9px auto 0;background:#ff745c;color:white;border:0;border-radius:9px;padding:8px 13px;font-weight:900;box-shadow:0 3px 0 #d65a4b';b.onclick=()=>{$('hint').innerHTML='<b>✦</b>Wish sent to the stars!';b.textContent='Wish sent ✦'};$('wish').after(b)}}});
</script><script>document.addEventListener('click',e=>{if(e.target.id==='wishSubmit'){document.getElementById('wish')?.classList.remove('show');document.getElementById('star')?.style.setProperty('display','none')}})</script></body></html>
